plugins {
    id 'com.android.application'
}

android {
    namespace 'com.neymis.web'
    compileSdk 34

    defaultConfig {
        applicationId 'com.neymis.web'
        minSdk 24
        targetSdk 34
        versionCode 21
        versionName '2.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "NeymisWeb-${variant.versionName}.apk"
        }
    }
}

dependencies {
    implementation project(":neymis-core")
}
